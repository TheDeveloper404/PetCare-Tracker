name: iOS verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Show installed Xcode
        run: xcodebuild -version
      - name: Scan for secrets
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  gitleaks.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" && rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner
      - name: Build, test and analyze
        run: bash scripts/verify.sh
